name: Deploy playback fix to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "src/components/VideoSurface.tsx"
      - "worker.js"
      - ".github/workflows/deploy-playback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy Worker and web assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret; Cloudflare deployment cannot proceed."
            exit 1
          fi
          pnpm dlx wrangler@4.161.0 deploy
