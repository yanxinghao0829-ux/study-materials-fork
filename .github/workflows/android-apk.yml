name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build and sign HGhub Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            grep -q '^packages:' pnpm-workspace.yaml || printf '\npackages: []\n' >> pnpm-workspace.yaml
          else
            printf 'packages: []\n' > pnpm-workspace.yaml
          fi
          pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci

      - name: Build APK
        run: pnpm tauri android build --apk --target aarch64

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was produced by the Android build."
            find src-tauri/gen/android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p release
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ALIGNED="release/HGhub-android-aligned.apk"
          FINAL="release/HGhub-android-signed.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          keytool -genkeypair -v \
            -keystore release/android-release.keystore \
            -storepass android -keypass android \
            -alias hghub -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HGhub Android, OU=Release, O=HGhub, C=US"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release/android-release.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$FINAL"
          test -s "$FINAL"
          sha256sum "$FINAL" | tee release/SHA256SUMS.txt
          rm -f release/android-release.keystore release/HGhub-android-aligned.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-Android-signed
          path: |
            release/HGhub-android-signed.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
