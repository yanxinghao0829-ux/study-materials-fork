name: PWA web build check

# Validate the browser-only guest build and Cloudflare Worker bundle.
# Re-trigger validation after repository Actions were re-enabled.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "server.mjs"
      - "worker.js"
      - "wrangler.toml"
      - "Dockerfile"
      - ".github/workflows/pwa-web-check.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the Worker to Cloudflare (requires CLOUDFLARE_API_TOKEN secret)"
        required: true
        type: boolean
        default: false

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check server.mjs
      - run: node --check worker.js
      - run: pnpm build
      - run: pnpm dlx wrangler@4.161.0 deploy --dry-run
      - name: Publish Cloudflare Worker
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Workers Scripts:Edit permission, then rerun with deploy enabled."
            exit 1
          fi
          pnpm dlx wrangler@4.161.0 deploy
