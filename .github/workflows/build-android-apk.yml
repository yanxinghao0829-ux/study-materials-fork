name: Build Android APK & Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      # ✅ Tauri官方Action，自动安卓初始化+打包，自动搞定SDK/NDK
      - name: Build Tauri Android
        uses: tauri-apps/tauri-action@v0
        with:
          args: android build --apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v1.2.1-android
          name: HGHub v1.2.1 安卓版
          body: |
            ✅ HGHub安卓构建包
            > ⚠️ 当前为**未签名APK**
            > 需要签名之后才能在安卓手机安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
