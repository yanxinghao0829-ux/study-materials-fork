name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install deps
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Sync android icons
        run: node scripts/sync-android-icons.mjs

      # Rust + Android四大编译目标
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      # 官方推荐稳定安卓SDK action v2
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      # 打印环境，用来排查ANDROID_HOME是否生效，失败的时候可以看日志
      - name: Print env debug
        run: |
          echo $ANDROID_HOME
          sdkmanager --list

      # Tauri v1 原生安卓打包命令
      - name: Build APK
        run: pnpm tauri android build

      - name: Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk






