name: Build Android APK
on:
  workflow_dispatch:  # 支持网页手动点击运行
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # 删掉了cache，不再要求package-lock.json，解决你刚才的lock文件报错

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Android APK
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: android build --apk
          tagName: apk-v__VERSION__
          releaseName: Android APK v__VERSION__
          releaseBody: 自动编译生成安卓APK安装包
          prerelease: false
