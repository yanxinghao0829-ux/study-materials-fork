name: Build Android APK & Release
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend deps
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 安卓SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 单独安装NDK r26d，Tauri2硬性要求NDK26，并且自动关联SDK路径
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Android Init
        run: pnpm tauri android init --ci

      - name: Build Android APK
        run: pnpm tauri android build -- --apk

      - name: Auto create Release 上传APK
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v1.2.1-android
          name: HGHub v1.2.1 安卓版
          body: |
            ✅ HGHub安卓构建包
            > ⚠️ 当前为**未签名APK**
            > 需要签名之后才能在安卓手机安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
