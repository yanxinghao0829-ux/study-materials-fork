name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend deps
        run: pnpm install

      - name: Frontend build
        run: pnpm build

      - name: Sync android icons
        run: node scripts/sync-android-icons.mjs

      # ✅ tauri-action v1 原生支持mobile/android打包，自带Android环境！！
      - name: Build Tauri Android
        uses: tauri-apps/tauri-action@v1
        with:
          args: mobile android build
          skipRelease: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk




