name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri Android APK
        uses: tauri-apps/tauri-action@v1
        with:
          args: android build --apk
          skipRelease: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/release/app-release-unsigned.apk
